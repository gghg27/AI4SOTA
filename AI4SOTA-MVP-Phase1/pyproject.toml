[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4sota-mvp"
version = "0.1.0"
description = "Phase 1 CLI foundation for the AI4SOTA research project workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.scripts]
ai4sota = "ai4sota.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai4sota = ["templates/**/*"]

